[package]
name = "fachwerker-navigator"
description = "Fachwerker-Navigator Gartenbau — offlinefähige Wissensdatenbank der Ausbildungsberatung"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "fachwerker_navigator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
navigator-core = { path = "../core" }
