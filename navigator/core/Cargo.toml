[package]
name = "navigator-core"
description = "Fachwerker-Navigator: Datenbank, Migrationen, Wissensimport und Volltextsuche (ohne UI-Abhängigkeiten)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
walkdir = "2"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
