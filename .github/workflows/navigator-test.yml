name: Navigator-Tests

on:
  push:
    branches: [main]
    paths: ["navigator/**", ".github/workflows/navigator-test.yml"]
  pull_request:
    paths: ["navigator/**", ".github/workflows/navigator-test.yml"]

jobs:
  inhalte:
    name: Inhalts-Validierung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node navigator/scripts/validate-content.mjs

  frontend:
    name: Frontend (tsc + Vite)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: navigator/app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: navigator/app/package-lock.json
      - run: npm ci
      - run: npm run build

  core:
    name: navigator-core (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: navigator }
      - run: cargo test -p navigator-core --manifest-path navigator/Cargo.toml

  tauri-check:
    name: Tauri-Shell (cargo check, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Systemabhängigkeiten (WebKitGTK u. a.)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: navigator/app/package-lock.json
      - name: Frontend bauen (generate_context! erwartet frontendDist)
        working-directory: navigator/app
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: navigator }
      - run: cargo check --workspace --manifest-path navigator/Cargo.toml
