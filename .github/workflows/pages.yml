name: GitHub Pages

# Veröffentlicht nach jedem Merge auf main die aktuellen Werkzeuge:
#   /            → Azubi-Wissen (Browsertool; Login nur mit Secret, siehe unten)
#   /navigator/  → Fachwerker-Navigator (Browser-Vorschau, Vite-Build)
# Voraussetzungen in den Repo-Einstellungen:
#   - Pages → Source = "GitHub Actions"
#   - optional: Secrets and variables → Actions → Secret ZUGANG_PASSWORT. Ist es
#     gesetzt, wird die Seite verschlüsselt und braucht ein Passwort (Login,
#     S48). Ohne Secret geht sie wie bisher ohne Login online.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: navigator/app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Navigator-Vorschau bauen
        working-directory: navigator/app
        run: npm ci && npm run build

      - name: Seite zusammenstellen
        run: |
          mkdir -p _site/navigator
          cp index.html bw-theme.css site.webmanifest sw.js azubi-wissen-offline.html _site/
          # Service-Worker-Version = Commit-Stand: jede Auslieferung bekommt
          # einen eigenen Kern-Cache (konsistente App-Shell, kein Misch-Stand).
          sed -i "s/dev-lokal/${GITHUB_SHA:0:8}/" _site/sw.js
          cp -r assets _site/assets
          cp -r formulare _site/formulare
          cp -r navigator/app/dist/. _site/navigator/
          # Jekyll aus dem Weg — Verzeichnisse mit Unterstrich u. ä. unangetastet lassen
          touch _site/.nojekyll

      # Zugangsschutz (S48), optional: Mit Secret ZUGANG_PASSWORT werden
      # Inhalte, Suchindex, Dateien und Offline-Datei verschlüsselt
      # (tools/zugang_bauen.py) — die Seite braucht dann ein Passwort. Ohne
      # Secret geht sie ohne Login online. Einschalten = Secret anlegen,
      # ändern = Secret ändern; der nächste Deploy übernimmt es.
      - name: Zugangsschutz (nur mit Secret ZUGANG_PASSWORT)
        env:
          ZUGANG_PASSWORT: ${{ secrets.ZUGANG_PASSWORT }}
        run: |
          if [ -z "$ZUGANG_PASSWORT" ]; then
            echo "::notice title=Zugangsschutz aus::Kein Secret ZUGANG_PASSWORT — die Seite geht ohne Login online."
            echo "Zugangsschutz aus: kein Secret ZUGANG_PASSWORT, die Seite geht ohne Login online." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          pip install --quiet cryptography
          python3 tools/zugang_bauen.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
