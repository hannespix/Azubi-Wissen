<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Ausbildung Grüne Berufe">
  <!-- App-Zeichen „Keimling": zwei Blätter aus Kreisbogen-Linsen, Schwarz
       auf BaWü-Gelb (Landes-CD: Flächenfarbe Gelb, warmes Schwarz, flach,
       ohne Schatten). Motiv liegt in der 80%-Safe-Zone (maskable). -->
  <rect width="512" height="512" fill="#FFFC00"/>
  <!-- Stiel mit Abzweig -->
  <path d="M250 442 C247 400 252 366 272 312" fill="none" stroke="#2A2623" stroke-width="30" stroke-linecap="round"/>
  <path d="M254 394 C248 380 244 370 234 356" fill="none" stroke="#2A2623" stroke-width="26" stroke-linecap="round"/>
  <!-- großes Blatt (Linse aus zwei Kreisbögen) -->
  <path d="M272 312 A166 166 0 0 1 412 140 A166 166 0 0 1 272 312 Z" fill="#2A2623"/>
  <!-- kleines Blatt -->
  <path d="M234 356 A112 112 0 0 1 120 260 A112 112 0 0 1 234 356 Z" fill="#2A2623"/>
  <!-- Mittelrippen als gelbe Aussparung -->
  <path d="M282 302 L398 154" fill="none" stroke="#FFFC00" stroke-width="13" stroke-linecap="round"/>
  <path d="M226 348 L136 270" fill="none" stroke="#FFFC00" stroke-width="11" stroke-linecap="round"/>
</svg>
